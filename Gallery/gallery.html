<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Aswin Krishna</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
        }

        .header {
            text-align: center;
            margin: 40px 0;
        }

        .header h1 {
            font-size: 2.5em;
            color: #333;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 0 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Gallery</h1>
    </div>
    <div class="gallery">
        <!-- Add your images here using this format: -->
        <img src="/Resources/anime_warrior.png" alt="Description">
        <img src="/Resources/Banner design2 WO PHNO.png" alt="Description">
        <img src="/Resources/ImageIcon.png" alt="Description">
        <img src="/Resources/ImageIcon.png" alt="Description">
        <img src="/Resources/ImageIcon.png" alt="Description">
        <img src="/Resources/ImageIcon.png" alt="Description">
        <img src="/Resources/ImageIcon.png" alt="Description">
        <img src="/Resources/ImageIcon.png" alt="Description">
        <img src="/Resources/ImageIcon.png" alt="Description">
        <!-- Add more images as needed -->
    </div>
</body>
</html>
